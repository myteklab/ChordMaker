<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2a55"/>
      <stop offset="100%" style="stop-color:#151329"/>
    </linearGradient>
    <filter id="cmGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#cmBg)"/>
  <!-- Fretboard panel -->
  <rect x="16" y="16" width="96" height="96" rx="10" fill="#1a1a2e"/>
  <!-- Nut -->
  <rect x="28" y="26" width="72" height="6" rx="3" fill="#f5f5f5"/>
  <!-- Frets -->
  <rect x="28" y="52" width="72" height="3" rx="1.5" fill="#3d3a66"/>
  <rect x="28" y="76" width="72" height="3" rx="1.5" fill="#3d3a66"/>
  <rect x="28" y="100" width="72" height="3" rx="1.5" fill="#3d3a66"/>
  <!-- Strings -->
  <rect x="31" y="29" width="2.5" height="74" rx="1.25" fill="#8f8bb8"/>
  <rect x="47" y="29" width="2.5" height="74" rx="1.25" fill="#8f8bb8"/>
  <rect x="63" y="29" width="2.5" height="74" rx="1.25" fill="#8f8bb8"/>
  <rect x="79" y="29" width="2.5" height="74" rx="1.25" fill="#8f8bb8"/>
  <rect x="95" y="29" width="2.5" height="74" rx="1.25" fill="#8f8bb8"/>
  <!-- Finger positions, vivid and glowing -->
  <circle cx="48.25" cy="42" r="7.5" fill="#fd79a8" filter="url(#cmGlow)"/>
  <circle cx="80.25" cy="64" r="7.5" fill="#00cec9" filter="url(#cmGlow)"/>
  <circle cx="64.25" cy="88" r="7.5" fill="#fdcb6e" filter="url(#cmGlow)"/>
  <!-- Dot highlights -->
  <circle cx="46.5" cy="40" r="2.2" fill="rgba(255,255,255,0.55)"/>
  <circle cx="78.5" cy="62" r="2.2" fill="rgba(255,255,255,0.55)"/>
  <circle cx="62.5" cy="86" r="2.2" fill="rgba(255,255,255,0.55)"/>
</svg>
